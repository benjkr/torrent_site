services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: torrent_site-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=8080
    volumes:
      - ./.dev/qbittorrent/config:/config
      - ./.dev/qbittorrent/downloads:/downloads
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
